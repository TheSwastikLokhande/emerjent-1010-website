<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Gaming PC</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }
    #canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas:active {
      cursor: grabbing;
    }
    #loader {
      position: absolute;
      color: #3b82f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      font-weight: 500;
      pointer-events: none;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loader">Initializing 3D Space...</div>
  <canvas id="canvas"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Hide loader once scripts have loaded
    document.getElementById('loader').style.display = 'none';

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);

    // Camera setup
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 3, 5);

    // Renderer setup
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera going below floor
    controls.minDistance = 3.5;
    controls.maxDistance = 10;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0;

    // Lights
    const ambientLight = new THREE.AmbientLight(0x020617, 2.0);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);

    // Glowing RGB inner lights
    const glowLight1 = new THREE.PointLight(0x00ffff, 4, 6); // Cyan
    glowLight1.position.set(0, 0.3, 0);
    scene.add(glowLight1);

    const glowLight2 = new THREE.PointLight(0xd946ef, 4, 6); // Magenta
    glowLight2.position.set(0.5, -0.4, 0.4);
    scene.add(glowLight2);

    // --- Build PC Model ---
    const pcGroup = new THREE.Group();
    scene.add(pcGroup);

    // 1. Chassis Outer Case (Transparent Dark Tempered Glass Panels)
    const caseGeo = new THREE.BoxGeometry(1.8, 2.5, 2.5);
    const caseMat = new THREE.MeshPhysicalMaterial({
      color: 0x0f172a,
      transparent: true,
      opacity: 0.3,
      roughness: 0.1,
      metalness: 0.1,
      transmission: 0.7,
      thickness: 0.3,
      side: THREE.DoubleSide
    });
    const pcCase = new THREE.Mesh(caseGeo, caseMat);
    pcGroup.add(pcCase);

    // Chassis Metal Bezel/Frames
    const frameGeo = new THREE.BoxGeometry(1.82, 2.52, 2.52);
    const frameMat = new THREE.MeshStandardMaterial({
      color: 0x1e293b,
      roughness: 0.3,
      metalness: 0.8,
      wireframe: true
    });
    const pcFrame = new THREE.Mesh(frameGeo, frameMat);
    pcGroup.add(pcFrame);

    // Case feet
    const footMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.8, metalness: 0.2 });
    const footGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.12, 16);
    const positions = [
      [-0.7, -1.31, -1.0],
      [0.7, -1.31, -1.0],
      [-0.7, -1.31, 1.0],
      [0.7, -1.31, 1.0]
    ];
    positions.forEach(pos => {
      const foot = new THREE.Mesh(footGeo, footMat);
      foot.position.set(pos[0], pos[1], pos[2]);
      pcGroup.add(foot);
    });

    // 2. Motherboard (Dark backplate)
    const moboGeo = new THREE.BoxGeometry(0.08, 2.1, 2.1);
    const moboMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6, metalness: 0.3 });
    const mobo = new THREE.Mesh(moboGeo, moboMat);
    mobo.position.set(-0.8, 0, 0);
    pcGroup.add(mobo);

    // Motherboard details (Silver components)
    const detailGeo = new THREE.BoxGeometry(0.02, 0.4, 0.4);
    const detailMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.2, metalness: 0.9 });
    const moboDetail = new THREE.Mesh(detailGeo, detailMat);
    moboDetail.position.set(-0.76, 0.7, -0.6);
    pcGroup.add(moboDetail);

    // RAM Sticks (with RGB top bar)
    const ramGroup = new THREE.Group();
    const ramGeo = new THREE.BoxGeometry(0.12, 0.42, 0.04);
    const ramMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
    const rgbBarGeo = new THREE.BoxGeometry(0.13, 0.04, 0.04);
    const rgbBarMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

    for (let i = 0; i < 4; i++) {
      const ram = new THREE.Mesh(ramGeo, ramMat);
      ram.position.set(-0.72, 0.5, -0.15 + (i * 0.1));
      const rgbBar = new THREE.Mesh(rgbBarGeo, rgbBarMat);
      rgbBar.position.set(-0.71, 0.72, -0.15 + (i * 0.1));
      ramGroup.add(ram);
      ramGroup.add(rgbBar);
    }
    pcGroup.add(ramGroup);

    // 3. GPU (Graphics Card with RGB logo and fans)
    const gpuGroup = new THREE.Group();
    const gpuGeo = new THREE.BoxGeometry(0.65, 0.5, 1.8);
    const gpuMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.4, metalness: 0.8 });
    const gpu = new THREE.Mesh(gpuGeo, gpuMat);
    gpu.position.set(-0.3, -0.3, 0);
    gpuGroup.add(gpu);

    // GPU RGB Logo
    const gpuLogoGeo = new THREE.BoxGeometry(0.02, 0.08, 0.5);
    const gpuLogoMat = new THREE.MeshBasicMaterial({ color: 0xd946ef });
    const gpuLogo = new THREE.Mesh(gpuLogoGeo, gpuLogoMat);
    gpuLogo.position.set(0.03, -0.3, 0);
    gpuGroup.add(gpuLogo);

    // GPU Fans
    const gpuFanMat = new THREE.MeshStandardMaterial({ color: 0x030712, roughness: 0.9 });
    const gpuFanGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.02, 16);
    const gpuFan1 = new THREE.Mesh(gpuFanGeo, gpuFanMat);
    gpuFan1.rotation.z = Math.PI / 2;
    gpuFan1.position.set(-0.3, -0.56, -0.4);
    const gpuFan2 = gpuFan1.clone();
    gpuFan2.position.set(-0.3, -0.56, 0.4);
    gpuGroup.add(gpuFan1);
    gpuGroup.add(gpuFan2);

    pcGroup.add(gpuGroup);

    // 4. Liquid CPU Cooler Block (Circle with glowing RGB ring)
    const coolerGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.15, 32);
    const coolerMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.7 });
    const cooler = new THREE.Mesh(coolerGeo, coolerMat);
    cooler.rotation.z = Math.PI / 2;
    cooler.position.set(-0.68, 0.5, 0.35);
    pcGroup.add(cooler);

    const coolerGlowGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.04, 32);
    const coolerGlowMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });
    const coolerGlow = new THREE.Mesh(coolerGlowGeo, coolerGlowMat);
    coolerGlow.rotation.z = Math.PI / 2;
    coolerGlow.position.set(-0.59, 0.5, 0.35);
    pcGroup.add(coolerGlow);

    // Cooler Tubes
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.6, 0.5, 0.35),
      new THREE.Vector3(-0.3, 0.7, 0.5),
      new THREE.Vector3(-0.3, 1.0, 0.7),
      new THREE.Vector3(-0.5, 1.1, 0.7)
    ]);
    const tubeGeo = new THREE.TubeGeometry(curve, 20, 0.06, 8, false);
    const tubeMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.9 });
    const tube = new THREE.Mesh(tubeGeo, tubeMat);
    pcGroup.add(tube);

    // 5. RGB Case Fans (Front intake and rear exhaust)
    const fans = [];
    const fanPositions = [
      { pos: [0.86, 0.6, 0], rot: [0, 0, Math.PI / 2] }, // Front Top
      { pos: [0.86, -0.2, 0], rot: [0, 0, Math.PI / 2] }, // Front Bottom
      { pos: [-0.5, 0.6, -1.21], rot: [Math.PI / 2, 0, 0] } // Rear Exhaust
    ];

    const fanFrameGeo = new THREE.BoxGeometry(0.08, 0.75, 0.75);
    const fanFrameMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 });
    const fanBladeGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.02, 16);
    const fanBladeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });

    fanPositions.forEach((fp) => {
      const fanGroup = new THREE.Group();
      
      const frame = new THREE.Mesh(fanFrameGeo, fanFrameMat);
      fanGroup.add(frame);

      const blades = new THREE.Mesh(fanBladeGeo, fanBladeMat);
      blades.rotation.z = Math.PI / 2;
      fanGroup.add(blades);

      fanGroup.position.set(fp.pos[0], fp.pos[1], fp.pos[2]);
      fanGroup.rotation.set(fp.rot[0], fp.rot[1], fp.rot[2]);
      
      pcGroup.add(fanGroup);
      fans.push(blades);
    });

    // 6. Ground Floor Grid
    const gridHelper = new THREE.GridHelper(20, 20, 0x1e293b, 0x0f172a);
    gridHelper.position.y = -1.38;
    scene.add(gridHelper);

    // RGB color cycling variables
    let time = 0;

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      time += 0.025;

      // Spin blades
      fans.forEach(fan => {
        fan.rotation.y += 0.12;
      });

      // Cycling RGB lights
      const r = Math.sin(time) * 0.5 + 0.5;
      const g = Math.sin(time + 2) * 0.5 + 0.5;
      const b = Math.sin(time + 4) * 0.5 + 0.5;
      const color = new THREE.Color(r, g, b);

      glowLight1.color.copy(color);
      coolerGlowMat.color.copy(color);
      ramGroup.children.forEach(child => {
        if (child.material === rgbBarMat) {
          child.material.color.copy(color);
        }
      });
      fans.forEach(fan => {
        fan.material.color.copy(color);
      });

      // Shift GPU color slightly offset
      const colorAlt = new THREE.Color(b, r, g);
      gpuLogoMat.color.copy(colorAlt);
      glowLight2.color.copy(colorAlt);

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // Window Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
